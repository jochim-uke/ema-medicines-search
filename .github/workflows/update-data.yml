name: Update EMA data

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-data.mjs"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "25 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate EMA data
        run: node scripts/build-data.mjs
      - name: Commit changed data
        run: |
          if [ -z "$(git status --porcelain -- data/medicines.json)" ]; then
            echo "EMA data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/medicines.json
          git commit -m "Update EMA medicine data"
          git push
